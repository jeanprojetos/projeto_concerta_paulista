{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h3 class="mb-3 text-success">Registrar Novo Buraco</h3>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-2">Enviar Denúncia</button>
            </form>
            <a href="{% url 'lista_denuncias' %}" class="btn btn-link w-100 mt-2 text-secondary">Voltar</a>
        </div>
    </div>
</div>
{% endblock %}
