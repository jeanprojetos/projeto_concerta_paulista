{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Concerta Paulista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'core/css/style.css' %}" rel="stylesheet">
    <link rel="manifest" href="{% static 'core/manifest.json' %}">
    <meta name="theme-color" content="#1C8A4B">
    <link rel="icon" href="{% static 'core/img/icon-192.png' %}">
    <link rel="apple-touch-icon" href="{% static 'core/img/icon-192.png' %}">
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('cp-theme'); } catch (e) {}
            var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <nav class="cp-nav">
        <div class="container cp-nav-inner">
            <a class="cp-brand" href="{% url 'lista_denuncias' %}">
                <img class="cp-brand-mark" src="{% static 'core/img/icon-192.png' %}" alt="" width="40" height="40">
                <span class="cp-brand-name">Concerta Paulista</span>
            </a>
            <button type="button" id="cp-theme-toggle" class="cp-theme-toggle" aria-label="Alternar tema claro ou escuro">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
                </svg>
            </button>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="cp-footer">
        <div class="container cp-footer-inner">
            <span class="cp-footer-text">Concerta Paulista 2026. Todos os direitos reservados.</span>
        </div>
    </footer>

    <script src="{% static 'core/js/theme.js' %}"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function () {});
            });
        }
    </script>
</body>
</html>
